name: tests

on:
  pull_request:
  push:
    # staging = what the demo server runs (docs/DEPLOYMENT.md §2).
    branches: [main, staging]

# A newer push to the same branch makes the older run pointless: cancel it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lock file (Symfony 8.1, Pest 5, PHPUnit 13) needs PHP >= 8.4.1, see composer.json.
        php: ['8.4']

    services:
      mysql:
        # MySQL 8.0, like the demo server's MySQL (confirm with SELECT VERSION(), docs/DEPLOYMENT.md §3.1).
        # Throwaway CI container.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fails the build when an installed package has a known security advisory.
      # Abandoned packages are only reported (not a vulnerability by themselves).
      - name: Check dependencies for security advisories
        run: composer audit --abandoned=report

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --compact
